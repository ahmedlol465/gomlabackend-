<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بابا عبدو — لوحة التحكم</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  body { background: #F6F8FB; margin: 0; color: #222; }
  header { background: linear-gradient(135deg, #0B63E5, #00A651); color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; flex: 1; min-width: 200px; }
  header .logout { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  nav { display: flex; gap: 6px; padding: 10px 12px; background: #fff; overflow-x: auto; border-bottom: 1px solid #e3e8ef; position: sticky; top: 0; z-index: 10; }
  nav button { border: 1px solid #d5dce5; background: #fff; border-radius: 10px; padding: 8px 13px; cursor: pointer; white-space: nowrap; font-size: 13px; min-height: 38px; }
  nav button.active { background: #0B63E5; color: #fff; border-color: #0B63E5; }
  main { padding: 14px; max-width: 1200px; margin: auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { background: #fff; border-radius: 14px; padding: 14px; text-align: center; box-shadow: 0 1px 4px #0001; }
  .card b { font-size: 22px; color: #0B63E5; display: block; }
  .table-wrap { overflow-x: auto; background: #fff; border-radius: 14px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eef1f5; text-align: right; vertical-align: top; }
  th { background: #EAF3FB; white-space: nowrap; }
  td { word-break: break-word; }
  input, select, textarea { border: 1px solid #cfd6e0; border-radius: 8px; padding: 8px 9px; font-size: 13px; width: 100%; min-height: 38px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; background: #fff; padding: 12px; border-radius: 14px; margin-bottom: 12px; }
  .btn { background: #0B63E5; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; min-height: 40px; font-size: 14px; }
  .btn.red { background: #d32f2f; } .btn.green { background: #00a651; } .btn.ghost { background: #eef1f5; color: #222; }
  .btn.block { width: 100%; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .muted { color: #777; font-size: 12px; }
  #login { max-width: 400px; margin: 40px auto; background: #fff; padding: 28px 24px; border-radius: 18px; text-align: center; box-shadow: 0 2px 12px #0001; }
  #login h2 { margin-top: 0; }
  #login .field { margin-bottom: 12px; text-align: right; }
  #login label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  .hidden { display: none; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
  .badge.open { background: #FFE3E3; color: #d32f2f; }
  .badge.closed { background: #E3F6E9; color: #00a651; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px #0001; transition: .2s; }
  @media (max-width: 600px) {
    header { padding: 12px; }
    header h1 { font-size: 17px; }
    main { padding: 10px; }
    .cards { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .row { grid-template-columns: 1fr; }
    nav { padding: 8px; gap: 4px; }
    nav button { padding: 6px 10px; font-size: 12px; }
    #login { margin: 24px auto; padding: 22px 18px; }
  }
</style>
</head>
<body>
<header>
  <h1>🛠️ بابا عبدو — لوحة التحكم</h1>
  <button class="logout" id="logoutBtn" style="display:none" onclick="logout()">تسجيل الخروج</button>
</header>

<div id="login">
  <h2>دخول الإدارة</h2>
  <div class="field"><label>اسم المستخدم</label><input id="username" type="text" placeholder="admin" autocomplete="username"></div>
  <div class="field"><label>كلمة المرور</label><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"></div>
  <button class="btn block" onclick="doLogin()">دخول</button>
  <p class="muted" id="loginHint">اسم المستخدم: admin — كلمة المرور الافتراضية: admin123</p>
</div>

<div id="app" class="hidden">
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
const API = location.origin + '/api/v1/admin';
let TOKEN = localStorage.getItem('maksab-admin-token') || '';
let TAB = 'overview';
const TABS = [['overview','نظرة عامة'],['categories','الأقسام'],['products','المنتجات'],['offers','العروض والأسعار'],['coupons','الكوبونات'],['orders','الطلبات'],['users','العملاء'],['complaints','الشكاوى'],['security','الأمان']];
let SESSION_CHECKED = false;

function showLogin() {
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
function showApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('logoutBtn').style.display = '';
  renderTabs(); render();
}

async function doLogin() {
  const username = document.getElementById('username').value || 'admin';
  const password = document.getElementById('password').value;
  const hint = document.getElementById('loginHint');
  try {
    const r = await fetch(API + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    if (!r.ok) throw 0;
    const d = await r.json();
    TOKEN = d.token;
    localStorage.setItem('maksab-admin-token', TOKEN);
    if (username === 'admin' && password === 'admin123') {
      hint.innerHTML = '⚠️ أنت تستخدم كلمة المرور الافتراضية! غيّرها فوراً من تبويب الأمان.';
    } else {
      hint.innerHTML = '';
    }
    showApp();
  } catch (_) { alert('بيانات الدخول غير صحيحة'); }
}

async function checkSession() {
  if (!TOKEN || SESSION_CHECKED) return;
  SESSION_CHECKED = true;
  try {
    const r = await fetch(API + '/overview', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!r.ok) { TOKEN = ''; localStorage.removeItem('maksab-admin-token'); showLogin(); return; }
    showApp();
  } catch (_) { showLogin(); }
}
checkSession();
if (TOKEN && document.getElementById('app').classList.contains('hidden')) { /* wait for async check */ }

function logout() {
  TOKEN = ''; localStorage.removeItem('maksab-admin-token'); showLogin();
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([id, l]) =>
    `<button class="${TAB === id ? 'active' : ''}" onclick="TAB='${id}';renderTabs();render()">${l}</button>`).join('');
}

async function api(method, path, body) {
  const r = await fetch(API + path, { method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const num = (id, v = '', ph = '') => `<input id="${id}" type="number" step="any" value="${v}" placeholder="${ph}">`;
const txt = (id, v = '', ph = '') => `<input id="${id}" value="${esc(v)}" placeholder="${ph}">`;
const val = id => document.getElementById(id).value;

async function render() {
  const v = document.getElementById('view');
  v.innerHTML = '<p>جاري التحميل...</p>';
  try {
    if (TAB === 'overview') {
      const o = await api('GET', '/overview');
      v.innerHTML = `<div class="cards">
        <div class="card"><b>${o.products}</b>منتج</div>
        <div class="card"><b>${o.offers}</b>عرض سعري</div>
        <div class="card"><b>${o.orders}</b>طلب</div>
        <div class="card"><b>${o.users}</b>عميل</div>
        <div class="card"><b>${o.revenue}</b>إجمالي المبيعات (ج.م)</div>
        <div class="card ${o.complaints > 0 ? '' : ''}"><b style="${o.complaints > 0 ? 'color:#d32f2f' : ''}">${o.complaints}</b>شكاوى مفتوحة</div></div>
        <p class="muted">نموذج الخصم بالكمية: كل عرض له tiers مثل <code>5:3, 12:7, 24:12</code> أي خصم 3% من 5 قطع، 7% من 12، 12% من 24 — عدّلها من تبويب العروض والأسعار.</p>`;
    }
    if (TAB === 'categories') {
      const { items } = await api('GET', '/categories');
      v.innerHTML = `<div class="row">
        <input id="f-catname" placeholder="اسم القسم الجديد (مثال: منتجات أطفال)">
        <button class="btn" onclick="saveCategory()">+ إضافة قسم</button></div>
      <div class="table-wrap"><table><tr><th>القسم</th><th>عدد المنتجات</th><th>الترتيب</th><th></th></tr>${items.map((c, i) => `<tr>
        <td>${esc(c.name)}</td><td>${c.count}</td>
        <td class="actions">
          <button class="btn ghost" ${i === 0 ? 'disabled' : ''} onclick="moveCategory(${i}, -1)">↑</button>
          <button class="btn ghost" ${i === items.length - 1 ? 'disabled' : ''} onclick="moveCategory(${i}, 1)">↓</button>
        </td>
        <td class="actions">
          <button class="btn green" onclick="renameCategory('${esc(c.name)}')">تعديل الاسم</button>
          <button class="btn red" onclick="delCategory('${esc(c.name)}')">حذف</button>
        </td></tr>`).join('')}</table></div>
      <p class="muted">الترتيب هنا يتحكم في ترتيب الأقسام داخل التطبيق. لا يمكن حذف قسم به منتجات — انقل منتجاته أولاً أو أعد تسميته.</p>`;
    }
    if (TAB === 'products') {
      const [{ items }, { items: cats }] = await Promise.all([api('GET', '/products'), api('GET', '/categories')]);
      PRODS = items;
      v.innerHTML = `<div class="row">
        <input id="f-name" placeholder="اسم المنتج">
        <input id="f-cat" list="cat-list" placeholder="الفئة">
        <datalist id="cat-list">${cats.map((c) => `<option value="${esc(c.name)}">`).join('')}</datalist>
        <input id="f-brand" placeholder="العلامة">
        <input id="f-unit" placeholder="الوحدة (كانز/كيس)">
        <input id="f-bulkunit" placeholder="العبوة (كرتونة 24)">
        ${num('f-bulkqty', '', 'عدد العبوة')}
        <input id="f-img" placeholder="رابط الصورة">
        <input id="f-desc" placeholder="الوصف">
        <div class="actions"><button class="btn" id="f-addbtn" onclick="saveProduct()">+ إضافة منتج</button><button class="btn ghost hidden" id="f-cancelbtn" onclick="cancelEdit()">إلغاء</button></div>
      </div>
      <div class="table-wrap"><table><tr><th>الاسم</th><th>الفئة</th><th>العلامة</th><th>العبوة</th><th>صورة</th><th></th></tr>${items.map(p => `<tr><td>${esc(p.name)}<br><span class="muted">${esc(p.description || '')}</span></td><td>${esc(p.category)}</td><td>${esc(p.brand || '')}</td><td>${esc(p.bulkUnit || '')}</td><td>${p.image ? '✅' : '—'}</td>
      <td class="actions"><button class="btn ghost" onclick="editProduct('${p.id}')">تعديل</button><button class="btn red" onclick="delProduct('${p.id}')">حذف</button></td></tr>`).join('')}</table></div>`;
    }
    if (TAB === 'offers') {
      const [{ items: offers }, { items: prods }] = await Promise.all([api('GET', '/offers'), api('GET', '/products')]);
      const pn = id => (prods.find(p => p.id === id) || {}).name || id;
      v.innerHTML = `<div class="row">
        <select id="f-prod"><option value="">اختار المنتج...</option>${prods.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        ${num('f-bulk', '', 'سعر الكرتونة')}${num('f-piece', '', 'سعر القطعة')}${num('f-old', '', 'سعر قبل الخصم')}${num('f-stock', '', 'المخزون')}
        ${txt('f-tiers', '5:3, 12:7, 24:12', 'tiers: حد:خصم,...')}
        <button class="btn" onclick="saveOffer()">+ إضافة عرض</button></div>
      <p class="muted">سعر القطعة = سعر البيع القطاعي. tiers = خصومات الكمية (تطبق على الكراتين والقطع): اكتبها <code>حد:خصم</code> مفصولة بفاصلة.</p>
      <div class="table-wrap"><table><tr><th>المنتج</th><th>كرتونة</th><th>قطعة</th><th>قبل الخصم</th><th>مخزون</th><th>tiers</th><th></th></tr>${offers.map(o => `<tr>
        <td>${esc(pn(o.productId))}</td>
        <td>${num('b-' + o.id, o.bulkPrice)}</td><td>${num('p-' + o.id, o.piecePrice)}</td><td>${num('o-' + o.id, o.oldPrice || '')}</td><td>${num('s-' + o.id, o.stock)}</td>
        <td>${txt('t-' + o.id, (o.tiers || []).map(t => t.minQty + ':' + t.discountPct).join(', '))}</td>
        <td class="actions"><button class="btn green" onclick="saveOfferRow('${o.id}')">حفظ</button><button class="btn red" onclick="delOffer('${o.id}')">حذف</button></td></tr>`).join('')}</table></div>`;
    }
    if (TAB === 'coupons') {
      const { items } = await api('GET', '/coupons');
      v.innerHTML = `<div class="row">${txt('f-code', '', 'الكود')}${num('f-disc', '', 'خصم ثابت')}${num('f-pct', '', 'خصم %')}${num('f-min', '', 'حد أدنى')}<button class="btn" onclick="saveCoupon()">+ إضافة</button></div>
      <div class="table-wrap"><table><tr><th>الكود</th><th>ثابت</th><th>%</th><th>حد أدنى</th><th>نشط</th><th></th></tr>${items.map(c => `<tr><td>${esc(c.code)}</td><td>${c.discount || ''}</td><td>${c.discountPct || ''}</td><td>${c.minOrder}</td><td>${c.active ? 'نعم' : 'لا'}</td>
      <td class="actions"><button class="btn ghost" onclick="toggleCoupon('${c.id}', ${!c.active})">${c.active ? 'إيقاف' : 'تفعيل'}</button><button class="btn red" onclick="delCoupon('${c.id}')">حذف</button></td></tr>`).join('')}</table></div>`;
    }
    if (TAB === 'orders') {
      const { items } = await api('GET', '/orders');
      v.innerHTML = `<div class="table-wrap"><table><tr><th>الطلب</th><th>الإجمالي</th><th>وفّر بالكمية</th><th>كوبون</th><th>الحالة</th><th>التاريخ</th><th></th></tr>${items.map(o => `<tr><td>${o.id.slice(0, 8)}</td><td>${o.total}</td><td>${o.tierSavings || 0}</td><td>${o.discount || 0}</td><td>${esc(orderStatusAr(o.status))}</td><td>${(o.createdAt || '').slice(0, 10)}</td>
      <td><select onchange="setOrder('${o.id}', this.value)">${['confirmed', 'preparing', 'shipping', 'delivered', 'cancelled'].map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`;
    }
    if (TAB === 'users') {
      const { items } = await api('GET', '/users');
      v.innerHTML = `<div class="table-wrap"><table><tr><th>المحل</th><th>الهاتف</th><th>KYC</th><th>نقاط</th><th></th><th></th></tr>${items.map(u => `<tr><td>${esc(u.shopName || u.name)}</td><td>${esc(u.phone)}</td><td>${esc(u.kycStatus)}</td><td>${u.points || 0}</td>
      <td><select onchange="setKyc('${u.id}', this.value)">${['pending', 'under_review', 'approved', 'rejected'].map(s => `<option ${s === u.kycStatus ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      <td><button class="btn red" onclick="delUser('${u.id}')">حذف</button></td></tr>`).join('')}</table></div>`;
    }
    if (TAB === 'complaints') {
      const { items } = await api('GET', '/complaints');
      v.innerHTML = `<div class="table-wrap"><table><tr><th>العميل</th><th>الرسالة</th><th>الحالة</th><th>التاريخ</th><th></th></tr>${items.map(c => `<tr>
        <td>${esc(c.userName || '')}<br><span class="muted">${esc(c.phone || '')}</span></td>
        <td>${esc(c.message)}${c.adminReply ? `<br><br><b>ردك:</b> ${esc(c.adminReply)}` : ''}</td>
        <td><span class="badge ${c.status}">${esc(c.status === 'open' ? 'مفتوحة' : 'مغلقة')}</span></td>
        <td>${(c.createdAt || '').slice(0, 10)}</td>
        <td class="actions">
          <input id="reply-${c.id}" style="min-width:120px" placeholder="اكتب ردك..." onkeydown="if(event.key==='Enter')replyComplaint('${c.id}')">
          <button class="btn green" onclick="replyComplaint('${c.id}')">رد</button>
          ${c.status === 'open' ? `<button class="btn ghost" onclick="closeComplaint('${c.id}')">إغلاق</button>` : ''}
        </td></tr>`).join('') || '<tr><td colspan=5>لا توجد شكاوى</td></tr>'}</table></div>`;
    }
    if (TAB === 'security') {
      v.innerHTML = `<div style="max-width:460px;margin:auto">
        <h3 style="text-align:center">🔒 إعدادات الأمان</h3>
        <div class="row">
          <label>اسم المستخدم</label>
          <input id="sec-username" value="admin" disabled>
          <label>كلمة المرور الحالية</label>
          <input id="sec-current" type="password" placeholder="كلمة المرور الحالية">
          <label>كلمة المرور الجديدة</label>
          <input id="sec-new" type="password" placeholder="كلمة المرور الجديدة (6 أحرف كحد أدنى)">
          <label>تأكيد كلمة المرور الجديدة</label>
          <input id="sec-confirm" type="password" placeholder="أعد كتابة كلمة المرور الجديدة">
          <button class="btn" onclick="changePassword()">💾 تغيير كلمة المرور</button>
        </div>
        <div class="table-wrap" style="padding:14px">
          <h4>حذف حساب عميل / تفريغ السجلات</h4>
          <p class="muted">لا يمكن حذف حسابات العملاء الذين لديهم طلبات إلا من تبويب العملاء (زر حذف بجانب كل عميل).</p>
        </div>
      </div>`;
    }
  } catch (e) {
    if (String(e.message).includes('401') || String(e.message).includes('403')) { logout(); return; }
    v.innerHTML = '<p>خطأ: ' + esc(e.message) + '</p>';
  }
}

function orderStatusAr(s) {
  const m = { 'confirmed': 'مؤكد', 'preparing': 'قيد التجهيز', 'shipping': 'قيد الشحن', 'delivered': 'تم التوصيل', 'cancelled': 'ملغي' };
  return m[s] || s;
}

function parseTiers(s) {
  return String(s || '').split(',').map(x => x.trim().split(':')).filter(a => a.length === 2).map(([a, b]) => ({ minQty: +a, discountPct: +b })).filter(t => t.minQty > 0 && t.discountPct >= 0);
}

let PRODS = [];
let EDIT_ID = null;

async function saveProduct() {
  const body = { name: val('f-name'), category: val('f-cat'), brand: val('f-brand'), unitName: val('f-unit') || 'قطعة', bulkUnit: val('f-bulkunit') || 'كرتونة', bulkQty: +val('f-bulkqty') || 1, image: val('f-img'), description: val('f-desc'), sellingFast: false };
  if (!body.name) { alert('اكتب اسم المنتج'); return; }
  if (EDIT_ID) { await api('PUT', '/products/' + EDIT_ID, body); }
  else { await api('POST', '/products', body); }
  EDIT_ID = null;
  render();
}
function setVal(id, v) { document.getElementById(id).value = v ?? ''; }
function editProduct(id) {
  const p = PRODS.find(x => x.id === id);
  if (!p) return;
  EDIT_ID = id;
  setVal('f-name', p.name); setVal('f-cat', p.category); setVal('f-brand', p.brand); setVal('f-unit', p.unitName); setVal('f-bulkunit', p.bulkUnit); setVal('f-bulkqty', p.bulkQty); setVal('f-img', p.image); setVal('f-desc', p.description);
  document.getElementById('f-addbtn').textContent = '💾 حفظ التعديل';
  document.getElementById('f-cancelbtn').classList.remove('hidden');
  window.scrollTo(0, 0);
}
function cancelEdit() { EDIT_ID = null; render(); }
async function delProduct(id) { if (confirm('حذف المنتج وعروضه؟')) { await api('DELETE', '/products/' + id); render(); } }
let CATS = [];
async function saveCategory() {
  const name = val('f-catname');
  if (!name || !name.trim()) { alert('اكتب اسم القسم'); return; }
  try { await api('POST', '/categories', { name: name.trim() }); render(); }
  catch (e) { alert('فشل الإضافة: ' + (e.message.includes('exists') ? 'القسم موجود مسبقاً' : e.message)); }
}
async function moveCategory(i, dir) {
  const r = await api('GET', '/categories');
  const names = r.items.map(c => c.name);
  const j = i + dir;
  if (j < 0 || j >= names.length) return;
  [names[i], names[j]] = [names[j], names[i]];
  await api('PUT', '/categories/reorder', { names });
  render();
}
async function renameCategory(name) {
  const newName = prompt('الاسم الجديد للقسم:', name);
  if (!newName || newName.trim() === name) return;
  try { await api('PUT', '/categories/' + encodeURIComponent(name), { newName: newName.trim() }); render(); }
  catch (e) { alert('فشل التعديل: ' + (e.message.includes('exists') ? 'القسم موجود مسبقاً' : e.message)); }
}
async function delCategory(name) {
  if (!confirm('حذف القسم "' + name + '"? (مسموح فقط إذا كان فارغاً)')) return;
  try { await api('DELETE', '/categories/' + encodeURIComponent(name)); render(); }
  catch (e) {
    if (String(e.message).includes('category_in_use')) alert('لا يمكن الحذف — القسم به منتجات. غيّر فئتها أولاً من تبويب المنتجات.');
    else alert('فشل الحذف: ' + e.message);
  }
}
async function saveOffer() {
  const pid = val('f-prod');
  if (!pid) { alert('اختار المنتج'); return; }
  await api('POST', '/offers', { productId: pid, wholesalerId: 'ws0', source: 'direct', bulkPrice: +val('f-bulk'), piecePrice: +val('f-piece'), oldPrice: +val('f-old') || null, stock: +val('f-stock') || 0, tiers: parseTiers(val('f-tiers')) });
  render();
}
async function saveOfferRow(id) {
  await api('PUT', '/offers/' + id, { bulkPrice: +val('b-' + id), piecePrice: +val('p-' + id), oldPrice: +val('o-' + id) || null, stock: +val('s-' + id), tiers: parseTiers(val('t-' + id)) });
  alert('تم الحفظ');
}
async function delOffer(id) { if (confirm('حذف العرض؟')) { await api('DELETE', '/offers/' + id); render(); } }
async function saveCoupon() {
  await api('POST', '/coupons', { code: val('f-code'), discount: +val('f-disc') || undefined, discountPct: +val('f-pct') || undefined, minOrder: +val('f-min') || 0, active: true });
  render();
}
async function toggleCoupon(id, active) { await api('PUT', '/coupons/' + id, { active }); render(); }
async function delCoupon(id) { if (confirm('حذف الكوبون؟')) { await api('DELETE', '/coupons/' + id); render(); } }
async function setOrder(id, status) { await api('PATCH', '/orders/' + id, { status }); }
async function setKyc(id, kycStatus) { await api('PATCH', '/users/' + id, { kycStatus }); render(); }
async function delUser(id) { if (confirm('حذف هذا العميل نهائياً؟')) { await api('DELETE', '/users/' + id); render(); } }
async function replyComplaint(id) {
  const reply = document.getElementById('reply-' + id).value;
  if (!reply || !reply.trim()) { alert('اكتب الرد أولاً'); return; }
  await api('PATCH', '/complaints/' + id, { adminReply: reply.trim(), status: 'closed' });
  render();
}
async function closeComplaint(id) { await api('PATCH', '/complaints/' + id, { status: 'closed' }); render(); }
async function changePassword() {
  const cur = val('sec-current');
  const nw = val('sec-new');
  const conf = val('sec-confirm');
  if (!cur) { alert('اكتب كلمة المرور الحالية'); return; }
  if (nw.length < 6) { alert('كلمة المرور الجديدة 6 أحرف كحد أدنى'); return; }
  if (nw !== conf) { alert('كلمتا المرور غير متطابقتين'); return; }
  try {
    const r = await api('POST', '/change-password', { currentPassword: cur, newPassword: nw });
    TOKEN = r.token;
    localStorage.setItem('maksab-admin-token', TOKEN);
    alert('✅ تم تغيير كلمة المرور بنجاح');
    render();
  } catch (e) { alert('فشل تغيير كلمة المرور: ' + e.message); }
}
