<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بابا عبدو — لوحة التحكم</title>
<style>
  * { box-sizing: border-box; font-family: 'Cairo', Tahoma, sans-serif; }
  body { background: #F6F8FB; margin: 0; color: #222; }
  header { background: #0B63E5; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 20px; margin: 0; }
  nav { display: flex; gap: 6px; padding: 10px 16px; background: #fff; overflow-x: auto; border-bottom: 1px solid #e3e8ef; position: sticky; top: 0; }
  nav button { border: 1px solid #d5dce5; background: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  nav button.active { background: #0B63E5; color: #fff; border-color: #0B63E5; }
  main { padding: 16px; max-width: 1200px; margin: auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 14px; text-align: center; box-shadow: 0 1px 4px #0001; }
  .card b { font-size: 22px; color: #0B63E5; display: block; }
  table { width: 100%; background: #fff; border-radius: 14px; border-collapse: collapse; overflow: hidden; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eef1f5; text-align: right; }
  th { background: #EAF3FB; }
  input, select, textarea { border: 1px solid #cfd6e0; border-radius: 8px; padding: 7px 9px; font-size: 13px; width: 100%; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; background: #fff; padding: 12px; border-radius: 14px; margin-bottom: 12px; }
  .btn { background: #0B63E5; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .btn.red { background: #d32f2f; } .btn.green { background: #00a651; } .btn.ghost { background: #eef1f5; color: #222; }
  .actions { display: flex; gap: 6px; }
  .muted { color: #777; font-size: 12px; }
  #login { max-width: 360px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 16px; text-align: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<header><h1>🛠️ بابا عبدو — لوحة التحكم</h1><span class="muted" style="color:#cfe0ff">تحكم كامل: منتجات • أسعار • خصومات كمية • تجار • كوبونات • طلبات</span></header>

<div id="login">
  <h2>دخول الإدارة</h2>
  <p class="muted">مفتاح الإدارة الافتراضي: admin123 (غيّره عبر ADMIN_KEY)</p>
  <input id="key" type="password" placeholder="مفتاح الإدارة">
  <br><br><button class="btn" onclick="doLogin()">دخول</button>
</div>

<div id="app" class="hidden">
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
const API = location.origin + '/api/v1/admin';
let KEY = localStorage.getItem('maksab-admin-key') || '';
let TAB = 'overview';
const TABS = [['overview','نظرة عامة'],['products','المنتجات'],['offers','العروض والأسعار'],['wholesalers','التجار والموردين'],['coupons','الكوبونات'],['orders','الطلبات'],['users','العملاء'],['complaints','الشكاوى']];

function doLogin() {
  KEY = document.getElementById('key').value || 'admin123';
  fetch(API + '/overview', { headers: { 'x-admin-key': KEY } }).then(r => {
    if (!r.ok) throw 0;
    localStorage.setItem('maksab-admin-key', KEY);
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    renderTabs(); render();
  }).catch(() => alert('مفتاح خاطئ'));
}
if (KEY) { document.getElementById('key').value = KEY; }

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([id, l]) =>
    `<button class="${TAB === id ? 'active' : ''}" onclick="TAB='${id}';renderTabs();render()">${l}</button>`).join('');
}
async function api(method, path, body) {
  const r = await fetch(API + path, { method, headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const esc = s => String(s ?? '').replace(/</g, '&lt;');
const num = (id, v = '', ph = '') => `<input id="${id}" type="number" step="any" value="${v}" placeholder="${ph}">`;
const txt = (id, v = '', ph = '') => `<input id="${id}" value="${esc(v)}" placeholder="${ph}">`;
const val = id => document.getElementById(id).value;

async function render() {
  const v = document.getElementById('view');
  v.innerHTML = '<p>جاري التحميل...</p>';
  try {
    if (TAB === 'overview') {
      const o = await api('GET', '/overview');
      v.innerHTML = `<div class="cards">
        <div class="card"><b>${o.products}</b>منتج</div>
        <div class="card"><b>${o.offers}</b>عرض سعري</div>
        <div class="card"><b>${o.orders}</b>طلب</div>
        <div class="card"><b>${o.users}</b>عميل</div>
        <div class="card"><b>${o.revenue}</b>إجمالي المبيعات (ج.م)</div>
        <div class="card"><b>${o.complaints}</b>شكاوى مفتوحة</div></div>
        <p class="muted">نموذج الخصم بالكمية: كل عرض له tiers مثل <code>5:3, 12:7, 24:12</code> أي خصم 3% من 5 قطع، 7% من 12، 12% من 24 — عدّلها من تبويب العروض والأسعار.</p>`;
    }
    if (TAB === 'products') {
      const { items } = await api('GET', '/products');
      PRODS = items;
      v.innerHTML = `<div class="row">${txt('f-name', '', 'اسم المنتج')}${txt('f-cat', '', 'الفئة')}${txt('f-brand', '', 'العلامة')}${txt('f-unit', '', 'الوحدة (كانز/كيس)')}${txt('f-bulkunit', '', 'العبوة (كرتونة 24)')}${num('f-bulkqty', '', 'عدد العبوة')}${txt('f-img', '', 'رابط الصورة')}${txt('f-desc', '', 'الوصف')}<button class="btn" id="f-addbtn" onclick="saveProduct()">+ إضافة منتج</button><button class="btn ghost hidden" id="f-cancelbtn" onclick="cancelEdit()">إلغاء</button></div>
      <table><tr><th>الاسم</th><th>الفئة</th><th>العلامة</th><th>العبوة</th><th>صورة</th><th></th></tr>${items.map(p => `<tr><td>${esc(p.name)}<br><span class="muted">${esc(p.description || '')}</span></td><td>${esc(p.category)}</td><td>${esc(p.brand || '')}</td><td>${esc(p.bulkUnit || '')}</td><td>${p.image ? '✅' : '—'}</td>
      <td class="actions"><button class="btn ghost" onclick="editProduct('${p.id}')">تعديل</button><button class="btn red" onclick="delProduct('${p.id}')">حذف</button></td></tr>`).join('')}</table>`;
    }
    if (TAB === 'offers') {
      const [{ items: offers }, { items: prods }, { items: wss }] = await Promise.all([api('GET', '/offers'), api('GET', '/products'), api('GET', '/wholesalers')]);
      const pn = id => (prods.find(p => p.id === id) || {}).name || id;
      const wn = id => (wss.find(w => w.id === id) || {}).name || id;
      v.innerHTML = `<div class="row">
        <select id="f-prod">${prods.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        <select id="f-ws">${wss.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select>
        <select id="f-src"><option value="direct">مباشر</option><option value="marketplace">سوق الجملة</option><option value="exclusive">حصري</option></select>
        ${num('f-bulk', '', 'سعر الكرتونة')}${num('f-piece', '', 'سعر القطعة')}${num('f-old', '', 'سعر قبل الخصم')}${num('f-stock', '', 'المخزون')}
        ${txt('f-tiers', '5:3, 12:7, 24:12', 'tiers: حد:خصم,...')}
        <button class="btn" onclick="saveOffer()">+ إضافة عرض</button></div>
      <p class="muted">سعر القطعة = سعر البيع القطاعي. tiers = خصومات الكمية (تطبق على الكراتين والقطع): اكتبها <code>حد:خصم</code> مفصولة بفاصلة.</p>
      <table><tr><th>المنتج</th><th>المورد</th><th>النوع</th><th>كرتونة</th><th>قطعة</th><th>قبل الخصم</th><th>مخزون</th><th>tiers</th><th></th></tr>${offers.map(o => `<tr>
        <td>${esc(pn(o.productId))}</td><td>${esc(wn(o.wholesalerId))}</td><td>${esc(o.source)}</td>
        <td>${num('b-' + o.id, o.bulkPrice)}</td><td>${num('p-' + o.id, o.piecePrice)}</td><td>${num('o-' + o.id, o.oldPrice || '')}</td><td>${num('s-' + o.id, o.stock)}</td>
        <td>${txt('t-' + o.id, (o.tiers || []).map(t => t.minQty + ':' + t.discountPct).join(', '))}</td>
        <td class="actions"><button class="btn green" onclick="saveOfferRow('${o.id}')">حفظ</button><button class="btn red" onclick="delOffer('${o.id}')">حذف</button></td></tr>`).join('')}</table>`;
    }
    if (TAB === 'wholesalers') {
      const { items } = await api('GET', '/wholesalers');
      v.innerHTML = `<div class="row">${txt('f-name', '', 'اسم المورد')}${txt('f-type', 'marketplace', 'النوع')}${num('f-min', '', 'حد أدنى')}${txt('f-eta', '', 'التوصيل')}${txt('f-phone', '', 'الهاتف')}<button class="btn" onclick="saveWs()">+ إضافة</button></div>
      <table><tr><th>الاسم</th><th>النوع</th><th>حد أدنى</th><th>توصيل</th><th>هاتف</th><th></th></tr>${items.map(w => `<tr><td>${txt('n-' + w.id, w.name)}</td><td>${esc(w.type)}</td><td>${num('m-' + w.id, w.minOrderValue)}</td><td>${txt('e-' + w.id, w.deliveryEta)}</td><td>${txt('h-' + w.id, w.phone || '')}</td>
      <td class="actions"><button class="btn green" onclick="saveWsRow('${w.id}')">حفظ</button><button class="btn red" onclick="delWs('${w.id}')">حذف</button></td></tr>`).join('')}</table>`;
    }
    if (TAB === 'coupons') {
      const { items } = await api('GET', '/coupons');
      v.innerHTML = `<div class="row">${txt('f-code', '', 'الكود')}${num('f-disc', '', 'خصم ثابت')}${num('f-pct', '', 'خصم %')}${num('f-min', '', 'حد أدنى')}<button class="btn" onclick="saveCoupon()">+ إضافة</button></div>
      <table><tr><th>الكود</th><th>ثابت</th><th>%</th><th>حد أدنى</th><th>نشط</th><th></th></tr>${items.map(c => `<tr><td>${esc(c.code)}</td><td>${c.discount || ''}</td><td>${c.discountPct || ''}</td><td>${c.minOrder}</td><td>${c.active ? 'نعم' : 'لا'}</td>
      <td class="actions"><button class="btn ghost" onclick="toggleCoupon('${c.id}', ${!c.active})">${c.active ? 'إيقاف' : 'تفعيل'}</button><button class="btn red" onclick="delCoupon('${c.id}')">حذف</button></td></tr>`).join('')}</table>`;
    }
    if (TAB === 'orders') {
      const { items } = await api('GET', '/orders');
      v.innerHTML = `<table><tr><th>الطلب</th><th>الإجمالي</th><th>وفّر بالكمية</th><th>كوبون</th><th>الحالة</th><th>التاريخ</th><th></th></tr>${items.map(o => `<tr><td>${o.id.slice(0, 8)}</td><td>${o.total}</td><td>${o.tierSavings || 0}</td><td>${o.discount || 0}</td><td>${esc(o.status)}</td><td>${(o.createdAt || '').slice(0, 10)}</td>
      <td><select onchange="setOrder('${o.id}', this.value)">${['confirmed', 'preparing', 'shipping', 'delivered', 'cancelled'].map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table>`;
    }
    if (TAB === 'users') {
      const { items } = await api('GET', '/users');
      v.innerHTML = `<table><tr><th>المحل</th><th>الهاتف</th><th>KYC</th><th>نقاط</th><th></th></tr>${items.map(u => `<tr><td>${esc(u.shopName || u.name)}</td><td>${esc(u.phone)}</td><td>${esc(u.kycStatus)}</td><td>${u.points || 0}</td>
      <td><select onchange="setKyc('${u.id}', this.value)">${['pending', 'under_review', 'approved', 'rejected'].map(s => `<option ${s === u.kycStatus ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table>`;
    }
    if (TAB === 'complaints') {
      const { items } = await api('GET', '/complaints');
      v.innerHTML = `<table><tr><th>الموضوع</th><th>الرسالة</th><th>الحالة</th><th></th></tr>${items.map(c => `<tr><td>${esc(c.subject)}</td><td>${esc(c.message)}</td><td>${esc(c.status)}</td>
      <td><button class="btn green" onclick="closeComplaint('${c.id}')">إغلاق</button></td></tr>`).join('') || '<tr><td colspan=4>لا توجد شكاوى</td></tr>'}</table>`;
    }
  } catch (e) { v.innerHTML = '<p>خطأ: ' + esc(e.message) + '</p>'; }
}
function parseTiers(s) {
  return String(s || '').split(',').map(x => x.trim().split(':')).filter(a => a.length === 2).map(([a, b]) => ({ minQty: +a, discountPct: +b })).filter(t => t.minQty > 0 && t.discountPct >= 0);
}
let PRODS = [];
let EDIT_ID = null;
async function saveProduct() {
  const body = { name: val('f-name'), category: val('f-cat'), brand: val('f-brand'), unitName: val('f-unit') || 'قطعة', bulkUnit: val('f-bulkunit') || 'كرتونة', bulkQty: +val('f-bulkqty') || 1, image: val('f-img'), description: val('f-desc'), sellingFast: false };
  if (!body.name) { alert('اكتب اسم المنتج'); return; }
  if (EDIT_ID) { await api('PUT', '/products/' + EDIT_ID, body); }
  else { await api('POST', '/products', body); }
  EDIT_ID = null;
  render();
}
function setVal(id, v) { document.getElementById(id).value = v ?? ''; }
function editProduct(id) {
  const p = PRODS.find(x => x.id === id);
  if (!p) return;
  EDIT_ID = id;
  setVal('f-name', p.name); setVal('f-cat', p.category); setVal('f-brand', p.brand); setVal('f-unit', p.unitName); setVal('f-bulkunit', p.bulkUnit); setVal('f-bulkqty', p.bulkQty); setVal('f-img', p.image); setVal('f-desc', p.description);
  document.getElementById('f-addbtn').textContent = '💾 حفظ التعديل';
  document.getElementById('f-cancelbtn').classList.remove('hidden');
  window.scrollTo(0, 0);
}
function cancelEdit() { EDIT_ID = null; render(); }
async function delProduct(id) { if (confirm('حذف المنتج وعروضه؟')) { await api('DELETE', '/products/' + id); render(); } }
async function saveOffer() {
  await api('POST', '/offers', { productId: val('f-prod'), wholesalerId: val('f-ws'), source: val('f-src'), bulkPrice: +val('f-bulk'), piecePrice: +val('f-piece'), oldPrice: +val('f-old') || null, stock: +val('f-stock') || 0, tiers: parseTiers(val('f-tiers')) });
  render();
}
async function saveOfferRow(id) {
  await api('PUT', '/offers/' + id, { bulkPrice: +val('b-' + id), piecePrice: +val('p-' + id), oldPrice: +val('o-' + id) || null, stock: +val('s-' + id), tiers: parseTiers(val('t-' + id)) });
  alert('تم الحفظ');
}
async function delOffer(id) { if (confirm('حذف العرض؟')) { await api('DELETE', '/offers/' + id); render(); } }
async function saveWs() {
  await api('POST', '/wholesalers', { name: val('f-name'), type: val('f-type') || 'marketplace', minOrderValue: +val('f-min') || 0, deliveryEta: val('f-eta'), phone: val('f-phone'), rating: 4.5, zone: 'القاهرة' });
  render();
}
async function saveWsRow(id) {
  await api('PUT', '/wholesalers/' + id, { name: val('n-' + id), minOrderValue: +val('m-' + id), deliveryEta: val('e-' + id), phone: val('h-' + id) });
  alert('تم الحفظ');
}
async function delWs(id) { if (confirm('حذف المورد؟')) { await api('DELETE', '/wholesalers/' + id); render(); } }
async function saveCoupon() {
  await api('POST', '/coupons', { code: val('f-code'), discount: +val('f-disc') || undefined, discountPct: +val('f-pct') || undefined, minOrder: +val('f-min') || 0, active: true });
  render();
}
async function toggleCoupon(id, active) { await api('PUT', '/coupons/' + id, { active }); render(); }
async function delCoupon(id) { if (confirm('حذف الكوبون؟')) { await api('DELETE', '/coupons/' + id); render(); } }
async function setOrder(id, status) { await api('PATCH', '/orders/' + id, { status }); }
async function setKyc(id, kycStatus) { await api('PATCH', '/users/' + id, { kycStatus }); render(); }
async function closeComplaint(id) { await api('PATCH', '/complaints/' + id, { status: 'closed' }); render(); }
</script>
</body>
</html>
